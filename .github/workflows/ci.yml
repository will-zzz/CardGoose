name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-format:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint (workspaces)
        run: pnpm -r run lint

      - name: Prettier check
        run: pnpm run format:check

      - name: Build landing site
        run: pnpm --filter landing build

      - name: Build frontend
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: pnpm --filter frontend build

  test-api:
    name: Unit tests (API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Prisma generate
        working-directory: api
        env:
          DATABASE_URL: postgresql://forge:forge@localhost:5432/cardgoose
          DIRECT_URL: postgresql://forge:forge@localhost:5432/cardgoose
        run: pnpm exec prisma generate

      - name: Vitest
        run: pnpm --filter api test
